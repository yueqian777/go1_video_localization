[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "go1-video-localization"
version = "0.1.0"
description = "基于Go1运动视频建图的照片目标定位系统"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
pipeline = [
  "opencv-python>=4.8",
  "pillow>=10",
  "pyyaml>=6",
  "h5py>=3.9",
  "scipy>=1.10",
  "tqdm>=4.36",
]
vision = [
  "torch>=2.2",
  "torchvision>=0.17",
  "pycolmap>=3.13",
]
test = ["coverage>=7.0"]
viewer = ["viser==1.1.1", "pillow>=10"]

[project.scripts]
go1loc = "go1loc.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
